[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-web-tester"
version = "0.1.0"
description = "AI Testing and Automation System - Use Claude's computer-use to test web applications"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ATLAS Team"}
]
keywords = ["testing", "automation", "ai", "claude", "playwright", "selenium"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "anthropic>=0.39.0",
    "playwright>=1.40.0",
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
atlas = "atlas_agent.cli:main"

[project.urls]
Homepage = "https://github.com/weownthebeach/atlas-agent"
Repository = "https://github.com/weownthebeach/atlas-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
